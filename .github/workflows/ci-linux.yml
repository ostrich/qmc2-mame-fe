name: CI (Linux)
on:
  push:
  pull_request:
  schedule:
    - cron: '11 4 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        qt: [6.8.3, 6.11.2]
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qt5compat qtmultimedia qtpositioning qtwebchannel qtwebengine
          cache: true
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev libcurl4-openssl-dev libminizip-dev libsdl2-dev ninja-build zlib1g-dev
      - name: Cache isolated QtScript
        id: qtscript-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.deps/qtscript
          key: qtscript-${{ runner.os }}-${{ runner.arch }}-qt-${{ matrix.qt }}-${{ hashFiles('scripts/bootstrap-qtscript.sh') }}
      - name: Build isolated QtScript
        if: steps.qtscript-cache.outputs.cache-hit != 'true'
        run: scripts/bootstrap-qtscript.sh --qt-root "$QT_ROOT_DIR" --prefix "$GITHUB_WORKSPACE/.deps/qtscript"
      - name: Build qmc2 and qchdman
        env:
          DISTCFG: 1
          LIBARCHIVE: 1
          QMAKEPATH: ${{ github.workspace }}/.deps/qtscript:${{ github.workspace }}/.deps/qtscript/lib/qt6
          QTSCRIPT_PREFIX: ${{ github.workspace }}/.deps/qtscript
        run: |
          make -j4 QMAKE="$QT_ROOT_DIR/bin/qmake" LRELEASE="$QT_ROOT_DIR/bin/lrelease" LUPDATE="$QT_ROOT_DIR/bin/lupdate"
          make -j4 QMAKE="$QT_ROOT_DIR/bin/qmake" LRELEASE="$QT_ROOT_DIR/bin/lrelease" LUPDATE="$QT_ROOT_DIR/bin/lupdate" qchdman
      - name: Validate system zlib and minizip
        run: |
          mkdir build-system-libs
          cd build-system-libs
          qmake ../qmc2.pro CONFIG+=release "DEFINES+=QMC2_SDLMAME QMC2_MULTIMEDIA=1 QMC2_LIBARCHIVE_ENABLED"
          make -f Makefile.qmake -j4
          ! ldd qmc2 | grep 'not found'
          ldd qmc2 | grep 'libminizip'
          ldd qmc2 | grep 'libz.so'
      - name: Run XML compatibility fixtures
        run: |
          mkdir build-xml-tests
          cd build-xml-tests
          qmake ../tests/xmlmachine/xmlmachine.pro
          make -j2
          ./tst_xmlmachine
      - name: Run QtScript compatibility fixtures
        env:
          QTSCRIPT_PREFIX: ${{ github.workspace }}/.deps/qtscript
        run: |
          mkdir build-qtscript-tests
          cd build-qtscript-tests
          qmake ../tests/qtscript/qtscript.pro
          make -j2
          QT_QPA_PLATFORM=offscreen ./tst_qtscript
      - name: Run FTP compatibility fixtures
        run: |
          mkdir build-ftp-tests
          cd build-ftp-tests
          qmake ../tests/ftp/ftp.pro
          make -j2
          ./tst_ftp
      - name: Run archive correctness fixtures
        run: |
          for test in archivefile bigbytearray sevenzip; do
            mkdir "build-$test-tests"
            cd "build-$test-tests"
            qmake "../tests/$test/$test.pro"
            make -j2
            "./tst_$test"
            cd ..
          done
      - name: Verify runtime libraries
        run: |
          ! ldd qmc2-sdlmame | grep 'not found'
          ! ldd src/tools/qchdman/qchdman | grep 'not found'
          ldd src/tools/qchdman/qchdman | grep "$GITHUB_WORKSPACE/.deps/qtscript/lib/libQt6Script"
      - uses: actions/upload-artifact@v4
        with:
          name: qmc2-linux-qt-${{ matrix.qt }}-${{ github.sha }}
          path: |
            qmc2-sdlmame
            src/tools/qchdman/qchdman
            .deps/qtscript/lib/libQt6Script*.so*
