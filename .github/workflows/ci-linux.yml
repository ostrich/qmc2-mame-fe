name: CI (Linux)
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        qt: [6.8.3, 6.11.2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: qt5compat qtmultimedia qtpositioning qtsvg qttools qtwebchannel qtwebengine
          cache: true
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev ninja-build
      - name: Build isolated QtScript
        run: scripts/bootstrap-qtscript.sh --qt-root "$QT_ROOT_DIR" --prefix "$GITHUB_WORKSPACE/.deps/qtscript"
      - name: Build qmc2 and qchdman
        env:
          DISTCFG: 1
          QMAKEPATH: ${{ github.workspace }}/.deps/qtscript:${{ github.workspace }}/.deps/qtscript/lib/qt6
          QTSCRIPT_PREFIX: ${{ github.workspace }}/.deps/qtscript
        run: |
          make -j4
          make -j4 qchdman
      - uses: actions/upload-artifact@v4
        with:
          name: qmc2-linux-qt-${{ matrix.qt }}-${{ github.sha }}
          path: |
            qmc2-sdlmame
            src/tools/qchdman/qchdman
            .deps/qtscript/lib/libQt6Script*.so*
