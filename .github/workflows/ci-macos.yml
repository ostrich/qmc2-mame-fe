name: CI (macOS)
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-13, arch: x64 }
          - { os: macos-15, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          modules: qt5compat qtmultimedia qtpositioning qtwebchannel qtwebengine
          cache: true
      - name: Install native dependencies
        run: |
          brew install curl libarchive ninja sdl2
          echo "PKG_CONFIG_PATH=$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - name: Build isolated QtScript
        run: scripts/bootstrap-qtscript.sh --qt-root "$QT_ROOT_DIR" --prefix "$GITHUB_WORKSPACE/.deps/qtscript"
      - name: Build qmc2 and qchdman
        env:
          DISTCFG: 1
          LIBARCHIVE: 1
          QMAKEPATH: ${{ github.workspace }}/.deps/qtscript:${{ github.workspace }}/.deps/qtscript/lib/qt6
          QTSCRIPT_PREFIX: ${{ github.workspace }}/.deps/qtscript
        run: |
          make -j3
          make -j3 qchdman
      - name: Run XML compatibility fixtures
        run: |
          mkdir build-xml-tests
          cd build-xml-tests
          qmake ../tests/xmlmachine/xmlmachine.pro
          make -j2
          ./tst_xmlmachine
      - name: Run QtScript compatibility fixtures
        env:
          QTSCRIPT_PREFIX: ${{ github.workspace }}/.deps/qtscript
        run: |
          mkdir build-qtscript-tests
          cd build-qtscript-tests
          qmake ../tests/qtscript/qtscript.pro
          make -j2
          QT_QPA_PLATFORM=offscreen ./tst_qtscript
      - name: Run FTP compatibility fixtures
        run: |
          mkdir build-ftp-tests
          cd build-ftp-tests
          qmake ../tests/ftp/ftp.pro
          make -j2
          ./tst_ftp
      - name: Run archive correctness fixtures
        run: |
          for test in archivefile bigbytearray sevenzip; do
            mkdir "build-$test-tests"
            cd "build-$test-tests"
            qmake "../tests/$test/$test.pro"
            make -j2
            "./tst_$test"
            cd ..
          done
      - name: Deploy application bundles
        run: |
          macdeployqt qmc2-sdlmame.app
          macdeployqt src/tools/qchdman/qchdman.app
          mkdir -p src/tools/qchdman/qchdman.app/Contents/Frameworks
          for framework in .deps/qtscript/lib/QtScript*.framework; do
            ditto "$framework" "src/tools/qchdman/qchdman.app/Contents/Frameworks/$(basename "$framework")"
          done
          install_name_tool -add_rpath @executable_path/../Frameworks src/tools/qchdman/qchdman.app/Contents/MacOS/qchdman
      - name: Verify bundled libraries
        run: |
          otool -L qmc2-sdlmame.app/Contents/MacOS/qmc2-sdlmame
          otool -L src/tools/qchdman/qchdman.app/Contents/MacOS/qchdman
          ! otool -L src/tools/qchdman/qchdman.app/Contents/MacOS/qchdman | grep "$GITHUB_WORKSPACE/.deps"
      - uses: actions/upload-artifact@v4
        with:
          name: qmc2-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            qmc2-sdlmame.app
            src/tools/qchdman/qchdman.app
