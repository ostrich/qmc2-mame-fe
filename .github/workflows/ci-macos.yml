name: CI (macOS)
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-13, arch: x64 }
          - { os: macos-15, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          modules: qt5compat qtmultimedia qtpositioning qtsvg qttools qtwebchannel qtwebengine
          cache: true
      - name: Install native dependencies
        run: brew install ninja sdl2
      - name: Build isolated QtScript
        run: scripts/bootstrap-qtscript.sh --qt-root "$QT_ROOT_DIR" --prefix "$GITHUB_WORKSPACE/.deps/qtscript"
      - name: Build qmc2 and qchdman
        env:
          DISTCFG: 1
          QMAKEPATH: ${{ github.workspace }}/.deps/qtscript
        run: |
          make -j3
          make -j3 qchdman
      - uses: actions/upload-artifact@v4
        with:
          name: qmc2-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            qmc2-sdlmame.app
            src/tools/qchdman/qchdman.app
            .deps/qtscript/lib/libQt6Script*.dylib
