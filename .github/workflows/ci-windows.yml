name: CI (Windows)
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-2022
    env:
      SDL_VERSION: 2.30.3
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qt5compat qtmultimedia qtpositioning qtsvg qttools qtwebchannel qtwebengine
          cache: true
      - name: Download SDL
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL2-devel-$env:SDL_VERSION-VC.zip" -OutFile "${{ runner.workspace }}\SDL2.zip"
          Expand-Archive "${{ runner.workspace }}\SDL2.zip" -DestinationPath "${{ runner.workspace }}"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install libcurl
        shell: pwsh
        run: vcpkg install curl:x64-windows
      - uses: msys2/setup-msys2@v2
        with:
          install: make
          path-type: inherit
      - name: Build isolated QtScript
        shell: pwsh
        run: scripts/bootstrap-qtscript.ps1 -QtRoot $env:QT_ROOT_DIR -Prefix "$env:GITHUB_WORKSPACE\.deps\qtscript"
      - name: Configure qmc2
        shell: msys2 {0}
        env:
          MKSPEC: win32-msvc
          FORCE_MINGW: 0
          ARCH: Windows
          SDL: 2
          SDL_LIBS: 'LIBS+="../SDL2-${SDL_VERSION}/lib/x64/SDL2.lib ../SDL2-${SDL_VERSION}/lib/x64/SDL2main.lib"'
          SDL_INCLUDEPATH: 'INCLUDEPATH+="../SDL2-${SDL_VERSION}/include"'
          QMAKEPATH: ${{ github.workspace }}\.deps\qtscript;${{ github.workspace }}\.deps\qtscript\lib\qt6
          QTSCRIPT_PREFIX: ${{ github.workspace }}\.deps\qtscript
        run: make -j4 configure
      - name: Build qmc2 and qchdman
        shell: pwsh
        env:
          QMAKEPATH: ${{ github.workspace }}\.deps\qtscript;${{ github.workspace }}\.deps\qtscript\lib\qt6
          QTSCRIPT_PREFIX: ${{ github.workspace }}\.deps\qtscript
        run: |
          nmake /f Makefile.qmake.release
          nmake qchdman
      - name: Run XML compatibility fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory build-xml-tests
          Set-Location build-xml-tests
          qmake ..\tests\xmlmachine\xmlmachine.pro CONFIG+=release
          nmake
          .\release\tst_xmlmachine.exe
      - name: Run QtScript compatibility fixtures
        shell: pwsh
        env:
          QTSCRIPT_PREFIX: ${{ github.workspace }}\.deps\qtscript
        run: |
          New-Item -ItemType Directory build-qtscript-tests
          Set-Location build-qtscript-tests
          qmake ..\tests\qtscript\qtscript.pro CONFIG+=release
          nmake
          .\release\tst_qtscript.exe
      - name: Run FTP compatibility fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory build-ftp-tests
          Set-Location build-ftp-tests
          qmake ..\tests\ftp\ftp.pro CONFIG+=release
          nmake
          .\release\tst_ftp.exe
      - name: Run archive correctness fixtures
        shell: pwsh
        run: |
          foreach ($test in @("bigbytearray", "sevenzip")) {
            New-Item -ItemType Directory "build-$test-tests"
            Push-Location "build-$test-tests"
            qmake "..\tests\$test\$test.pro" CONFIG+=release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            nmake
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\release\tst_$test.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
      - name: Deploy
        shell: pwsh
        run: |
          windeployqt release\qmc2-mame.exe
          windeployqt src\tools\qchdman\release\qchdman.exe
          Copy-Item "${{ runner.workspace }}\SDL2-$env:SDL_VERSION\lib\x64\SDL2.dll" release
          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { $env:VCPKG_INSTALLATION_ROOT }
          Copy-Item "$vcpkgRoot\installed\x64-windows\bin\*.dll" release
          Copy-Item .deps\qtscript\bin\Qt6Script*.dll src\tools\qchdman\release
      - name: Verify deployed applications start
        shell: pwsh
        run: |
          $qchdman = Start-Process src\tools\qchdman\release\qchdman.exe -PassThru
          Start-Sleep -Seconds 3
          if ($qchdman.HasExited) { throw "qchdman exited during startup with code $($qchdman.ExitCode)" }
          Stop-Process -Id $qchdman.Id
      - uses: actions/upload-artifact@v4
        with:
          name: qmc2-windows-msvc2022-${{ github.sha }}
          path: |
            release
            src/tools/qchdman/release
